<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>web-b2</title>
    <style>
      body { margin: 0 auto; padding: 0 16px; max-width: 48rem; font-family: system-ui, sans-serif; line-height: 1.6; }
      #top { position: sticky; top: 0; z-index: 1; display: flex; gap: 12px; align-items: center; padding: 8px 0; background: #fff; border-bottom: 1px solid #ddd; }
      #links { display: flex; gap: 12px; white-space: nowrap; overflow-x: auto; max-width: 50%; }
      #q { flex: 1; min-width: 0; box-sizing: border-box; font-size: 1rem; padding: 6px 8px; }
      #save-note { color: #900; font-size: 0.85rem; white-space: nowrap; }
      #save-note:empty { display: none; }
      a.missing { border-bottom: 1px dashed currentColor; text-decoration: none; opacity: 0.75; }
      .dates { color: #666; font-size: 0.85em; }
      .tools { display: flex; justify-content: flex-end; gap: 8px; margin: 8px 0; }
      .tools button { font-size: 0.85rem; padding: 2px 10px; }
      .editor .cm-editor { border: 1px solid #ddd; min-height: 12rem; font-size: 0.95rem; }
      .editor .cm-editor.cm-focused { outline: none; border-color: #999; }
      .conflict { padding: 8px 12px; border: 1px solid #c90; background: #ffc; }
      .conflict pre { max-height: 20rem; overflow: auto; white-space: pre-wrap; background: #fff; padding: 8px; }
      .conflict .choices { display: flex; gap: 8px; }
      .script-error { padding: 8px 12px; border: 1px solid #c33; background: #fee; color: #900; white-space: pre-wrap; }
      img { max-width: 100%; }
      pre { overflow-x: auto; }
      section.backlinks, section.two-hop { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #ddd; }
      section.backlinks h2, section.two-hop h2 { font-size: 1rem; color: #666; }
      .hop h3 { font-size: 0.95rem; margin: 0.8rem 0 0.2rem; }
      .hop ul { margin-top: 0; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
